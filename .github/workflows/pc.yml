name: native-c

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch PsyZ and SDL
        run: git submodule update --init third_party/psyz third_party/psyz/external/SDL
      - name: Install movie decoder dependencies
        run: brew install ffmpeg pkg-config
      - name: Build the native target
        run: |
          cmake -S . -B build
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
