      - {start: 0x16F4, type: data, name: menu_memcard_data_0016F4, linker_section_order: .text, linker_section: .code_data}
  - [0x2060]
  # The effect callbacks keep the 0x801EB7F8 link base of the block they were
  # copied from.
  - name: menu_memcard_effects
    type: code
    start: 0x2060
    vram: 0x801ED858
    align: 4
    subalign: 4
    bss_size: 0x0
    subsegments:
      - [0x2060, c, glint_effects]
      - [0x53A8, c, image_effects]
  - [0x63A0]
  # The screen and the second video player copy resolve their local jumps
  # at the 0x801887F0 link base (callers name some of them by their
  # 0x80120D44 load address). Units without local jumps sit at the same base.
  - name: menu_memcard_screen
    type: code
    start: 0x63A0
    vram: 0x8018EB90
    align: 4
    subalign: 4
    bss_size: 0x0
    subsegments:
      - {start: 0x63A0, type: data, name: menu_memcard_data_0063A0, linker_section_order: .text, linker_section: .code_data}
      - [0x6B04, c, page_flip]
      - [0x6C78, c, image_nodes]
      - [0x7874, c, list_screen]
      - [0x9108, c, video_playback]
  - [0xA7A8]
  # The fade code resolves its local jumps at the 0x801887A4 link base, 0x4C
  # (the size of the copied event-flag handler) below the video player's.
  - name: menu_memcard_fade
    type: code
    start: 0xA7A8
    vram: 0x80192F4C
    align: 4
    subalign: 4
    bss_size: 0x0
    subsegments:
      - [0xA7A8, c, fade]
  - [0xAA64]
  - name: menu_memcard_tail
    type: code
    start: 0xAA64
    vram: 0x8012B7A8
    align: 4
    subalign: 4
    bss_size: 0x0
    subsegments:
      - {start: 0xAA64, type: data, name: menu_memcard_data, linker_section_order: .text, linker_section: .code_data}
  - [0xB000]
