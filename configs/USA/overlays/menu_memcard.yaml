segments:
  - name: menu_memcard
    type: code
    start: 0x0
    vram: 0x80120D00
    align: 4
    subalign: 4
    bss_size: 0x0
    subsegments:
      # The block's local jumps and jal targets resolve at 0x80120D00, 0x44 bytes
